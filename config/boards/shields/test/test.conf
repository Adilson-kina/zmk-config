# Enable display support
CONFIG_ZMK_DISPLAY=y
CONFIG_SSD1306=y
CONFIG_SSD1306_DEFAULT_CONTRAST=255
CONFIG_ZMK_DISPLAY_WORK_QUEUE_DEDICATED=y

# Prevent the screen from turning off when idle
CONFIG_ZMK_DISPLAY_BLANK_ON_IDLE=n

# CRITICAL FIX for your screen
CONFIG_LV_Z_VDB_SIZE=100
CONFIG_LV_Z_MEM_POOL_SIZE=16384

# Use the custom status screen from zmk-nice-oled
CONFIG_ZMK_DISPLAY_STATUS_SCREEN_CUSTOM=y

# Enable the HID Indicators widget (shows NumLock, CapsLock, etc.)
CONFIG_NICE_OLED_WIDGET_HID_INDICATORS=y

# You can still enable other widgets you like
CONFIG_NICE_OLED_WIDGET_LAYER=y
CONFIG_NICE_OLED_WIDGET_BATTERY=y
CONFIG_NICE_OLED_WIDGET_OUTPUT=y
