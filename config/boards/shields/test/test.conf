# Enable display support
CONFIG_ZMK_DISPLAY=y
CONFIG_SSD1306=y
CONFIG_SSD1306_DEFAULT_CONTRAST=255
CONFIG_ZMK_DISPLAY_WORK_QUEUE_DEDICATED=y

# Prevent the screen from turning off when idle
CONFIG_ZMK_DISPLAY_BLANK_ON_IDLE=n

# CRITICAL FIX: Force LVGL to draw the entire screen at once (100%)
# instead of in tiny 10% chunks, which causes static on some screens.
CONFIG_LV_Z_VDB_SIZE=100
CONFIG_LV_Z_MEM_POOL_SIZE=16384

# Use the built-in status screen
CONFIG_ZMK_DISPLAY_STATUS_SCREEN_BUILT_IN=y

# Enable specific widgets
CONFIG_ZMK_WIDGET_LAYER_STATUS=y
CONFIG_ZMK_WIDGET_BATTERY_STATUS=y
CONFIG_ZMK_WIDGET_OUTPUT_STATUS=y
